name: Update News in Levels JSON

on:
  schedule:
    # GitHub cron uses UTC. Run every 6 hours so a missed publication window is picked up.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode'
        required: true
        default: recent
        type: choice
        options:
          - recent
          - full

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      SCRAPE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'recent' }}
      RECENT_PAGES: '3'
      CONCURRENCY: '6'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Scrape News in Levels
        run: node scraper.js

      - name: Commit updated JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/news.json

          if git diff --cached --quiet; then
            echo 'No changes in data/news.json'
            exit 0
          fi

          git commit -m 'chore: update News in Levels data'
          git push
